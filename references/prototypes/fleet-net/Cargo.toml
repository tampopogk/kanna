[package]
name = "fleet-net"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4", features = ["derive"] }
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring", "metrics", "fast-apple-datapath"] }
iroh-mdns-address-lookup = "=0.6.1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }

[workspace]
