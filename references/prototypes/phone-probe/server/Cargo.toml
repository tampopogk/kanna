[package]
name = "phone-probe-server"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
iroh-mdns-address-lookup = "=0.6.1"
n0-future = "0.3"
qrcode = { version = "0.14", default-features = false }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "time"] }
data-encoding = "2"
