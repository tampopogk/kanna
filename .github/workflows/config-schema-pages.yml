name: Config Schema Pages

on:
  push:
    branches:
      - main
    paths:
      - ".kanna/config.schema.json"
      - ".github/workflows/config-schema-pages.yml"
      - "tools/kd/**"
  workflow_dispatch:

# Deliberately empty at the top level. The Pages write and OIDC permissions
# belong to the job that deploys and nowhere else.
permissions: {}

concurrency:
  group: config-schema-pages
  cancel-in-progress: true

# There is deliberately no Linux build job here, and no `uses:` of another
# workflow in this file at all.
#
# This workflow used to carry a second `workflow_dispatch` option that called
# `.github/workflows/linux-release-check.yml`, on the theory that giving that
# job its own `contents: read` grant kept the build lane away from the
# deployment. It did not. GitHub validates a reusable-workflow call when the
# *caller* starts, and a validation error fails the whole file rather than the
# job that caused it. So on 2026-09-15 `3ea467806` gave the callee's new
# `prepared-fetch` job `contents: write` — more than this caller granted it —
# and every push to `main` afterwards put this workflow in `startup_failure`.
# The `deploy` job below never ran, and the public
# https://schemas.kanna.build/config.schema.json contract served stale bytes for
# six days with no job log to explain why.
#
# The entry point bought nothing either: `linux-release-check.yml` declares its
# own `workflow_dispatch`, with the inputs this one could not pass
# (`prepared_pair_asset_id`, `prepared_pair_sha256`,
# `prepared_pair_evidence_dir`, `apt_interop_only`). `gh workflow run
# linux-release-check.yml` is the better way in and always was.
#
# Do not add a `uses:` back. This workflow is continuous deployment of a public
# contract; it must not be able to fail for a reason belonging to another lane.
jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # `./kd` bootstraps its dependencies through pnpm, so both must exist
      # before it runs. Without these the step fails with `spawnSync pnpm ENOENT`.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/configure-pages@v5
      - name: Build Pages artifact
        run: ./kd pages build-schema --out-dir .build/pages-schema
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .build/pages-schema
      - id: deployment
        uses: actions/deploy-pages@v4
