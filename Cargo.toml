[workspace]
members = ["crates/kanna", "crates/kanna-build", "crates/kanna-calltree", "crates/kanna-client", "crates/kanna-cloud", "crates/kanna-crash", "crates/kanna-daemon", "crates/kanna-detect", "crates/kanna-diff", "crates/kanna-guest", "crates/kanna-ffi", "crates/kanna-ios-ffi", "crates/kanna-keeper", "crates/kanna-layout", "crates/kanna-log", "crates/kanna-merman", "crates/kanna-mux", "crates/kanna-net", "crates/kanna-pipe", "crates/kanna-quality", "crates/kanna-syntax", "crates/kanna-threads", "crates/kanna-vt"]
exclude = ["references", "vendor"]
resolver = "2"

[patch.crates-io]
netdev = { path = "vendor/netdev" }
netwatch = { path = "vendor/netwatch" }

[workspace.package]
version = "0.1.0"
edition = "2021"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
debug = "line-tables-only"
