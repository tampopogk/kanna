[package]
name = "kanna-terminal-recovery"
version = "0.1.0"
edition = "2021"

[lib]
name = "kanna_terminal_recovery"
path = "src/lib.rs"

[dependencies]
kanna-runtime-defaults = { path = "../../crates/runtime-defaults" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libghostty-vt = { git = "https://github.com/jemdiggity/libghostty-rs.git", rev = "66a7be5c56b883ee80bccde4b0f2ef619e488370", package = "libghostty-vt" }
ghostty-xterm-compat-serialize = { git = "https://github.com/jemdiggity/ghostty-xterm-compat-serialize.git", rev = "542896ad88cf01561fae9ec47dd7ac5f7deb7c1c" }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "recovery_mirror"
harness = false
