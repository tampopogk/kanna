[package]
name = "kanna-net"
version.workspace = true
edition.workspace = true
license = "FSL-1.1-MIT"
description = "Kanna's fleet network: the iroh endpoint, kanna/1 streams, the signed peer log and pairing."

[dependencies]
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring", "fast-apple-datapath"] }
iroh-mdns-address-lookup = "=0.6.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros", "fs", "process"] }
serde_json = "1"
spake2 = "0.4"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.2"
n0-future = "0.3"
