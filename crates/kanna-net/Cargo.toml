[package]
name = "kanna-net"
version.workspace = true
edition.workspace = true
license = "FSL-1.1-MIT"
description = "The network between your machines: the iroh endpoint, kanna/1 streams, the signed peer log and pairing."

[dependencies]
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
iroh-mdns-address-lookup = "=0.6.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros"] }
serde_json = "1"
spake2 = "0.4"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.2"
n0-future = "0.3"
data-encoding = "2"

[target.'cfg(target_os = "macos")'.dependencies]
iroh = { version = "=1.4.1", default-features = false, features = ["fast-apple-datapath"] }

[target.'cfg(target_os = "linux")'.dependencies]
mdns-sd = "=0.21.7"

[dev-dependencies]
base64 = "0.22"
kanna-build = { path = "../kanna-build" }
iroh-relay = { version = "=1.4.1", default-features = false, features = ["server"] }
