[package]
name = "kanna-ios-ffi"
version.workspace = true
edition.workspace = true
license = "FSL-1.1-MIT"
description = "The iPhone app's Rust, as one static library: its iroh endpoint and the phone stream (kanna-net)."

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
kanna-net = { path = "../kanna-net" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
