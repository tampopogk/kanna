[package]
name = "kanna-mux"
version.workspace = true
edition.workspace = true
license = "FSL-1.1-MIT"
description = "Kanna's mux core: kmux's control protocol, panes, the layout model, the state file and the socket server, in Rust. Ported from kmux's KmuxCore (MIT); kmux is the reference model."

[dependencies]
libc = "0.2"
serde_json = "1"
shlex = "2"
kanna-threads = { path = "../kanna-threads" }
