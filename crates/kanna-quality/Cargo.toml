[package]
name = "kanna-quality"
version.workspace = true
edition.workspace = true
license = "FSL-1.1-MIT"
description = "Kanna's code quality measures: functions' complexity, duplicated code, dead code and wrappers in Rust and Swift sources, parsed with tree-sitter; coverage from LCOV; and SZZ over a repo's main."

[dependencies]
tree-sitter = "0.27"
tree-sitter-rust = "0.24.2"
tree-sitter-swift = "0.7.4"
