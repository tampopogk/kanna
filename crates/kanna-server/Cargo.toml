[package]
name = "kanna-server"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["macros", "ws"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "0.48.2", default-features = false }
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
jsonwebtoken = "9"
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
# Same major version reqwest's rustls-tls feature and hyper-rustls already
# resolve transitively (see Cargo.lock) - added here as direct dependencies
# only so the LAN machine-invoke listener/client can use their types
# directly. `ring` explicitly, not rustls's own default `aws_lc_rs`: aws-lc-rs
# pulls aws-lc-sys, which needs cmake/a C toolchain to build from source -
# exactly the host build-machine dependency this repo's release builds must
# not require. `ring` is already the resolved provider elsewhere in this
# same dependency graph (see Cargo.lock), so this adds no second crypto
# backend to audit. rustls-pemfile decodes the PEM this desktop persists its
# own self-signed identity as; rcgen generates that identity (reviewed,
# widely-used cert-generation crate - no hand-rolled X.509/ASN.1 encoding),
# also pinned to its own `ring` feature for the same reason.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
futures-util = "0.3"
rusqlite = { version = "0.32.1", features = ["bundled", "hooks"] }
log = "0.4"
libc = "0.2"
flate2 = "1"
tar = "0.4"
flexi_logger = "0.31"
base64 = "0.22"
dirs = "6"
serde_yaml = "0.9"
sha2 = "0.10"
ed25519-dalek = "2"
kanna-daemon = { path = "../daemon" }
kanna-agent-protocol = { path = "../kanna-agent-protocol" }
kanna-runtime-defaults = { path = "../runtime-defaults" }
kanna-tool-catalog = { path = "../kanna-tool-catalog" }
kanna-visual-companion = { path = "../visual-companion" }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors"] }
if-addrs = "0.15"
mdns-sd = "0.19"
flume = { version = "0.11", default-features = false }
ignore = "0.4"
sysinfo = "0.33"
git2 = "0.19"
# Keep release TLS independent of the build host's OpenSSL installation.
openssl-sys = { version = "0.9", features = ["vendored"] }

[dev-dependencies]
tempfile = "3"
# `test-util` for the paused clock: proving that a stable daemon generation
# costs nothing takes minutes of the maintenance loop's time, not of the test
# suite's. Same line as `crates/daemon`, which shares this bazel resolve.
tokio = { version = "1", features = ["full", "test-util"] }
