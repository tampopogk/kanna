[package]
name = "kanna-guest"
version.workspace = true
edition.workspace = true
license = "FSL-1.1-MIT"
description = "Builds on a build Mac: the supervisor that runs jobs inside a tenant's macOS guest, and the frames, snapshot manifests, path maps and artifact intake shared with kanna build."

[dependencies]
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
getrandom = "0.2"

[[bin]]
name = "kanna-guest"
path = "src/main.rs"
