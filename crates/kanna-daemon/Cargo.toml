[package]
name = "kanna-daemon"
version.workspace = true
edition.workspace = true
license = "FSL-1.1-MIT"
description = "Kanna's daemon: kanna-mux on Kanna's socket, with the terminals and the app's link."

[dependencies]
kanna-build = { path = "../kanna-build" }
kanna-mux = { path = "../kanna-mux" }
kanna-keeper = { path = "../kanna-keeper" }
kanna-vt = { path = "../kanna-vt" }
kanna-detect = { path = "../kanna-detect" }
kanna-diff = { path = "../kanna-diff" }
kanna-net = { path = "../kanna-net" }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
notify = "8"
base64 = "0.22"
libc = "0.2"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
