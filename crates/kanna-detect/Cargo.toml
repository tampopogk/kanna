[package]
name = "kanna-detect"
version.workspace = true
edition.workspace = true
license = "FSL-1.1-MIT"
description = "Kanna's agents: which programs they are, the version each needs to report its status (OSC 7501), how each quits, and a turn's end. Ported in part from Kanna v3's kanna3-detect."

[dependencies]
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
