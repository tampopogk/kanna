[package]
name = "kanna"
version.workspace = true
edition.workspace = true
license = "FSL-1.1-MIT"

[dependencies]
kanna-build = { path = "../kanna-build" }
kanna-crash = { path = "../kanna-crash" }
kanna-client = { path = "../kanna-client" }
kanna-guest = { path = "../kanna-guest" }
kanna-calltree = { path = "../kanna-calltree" }
kanna-merman = { path = "../kanna-merman" }
kanna-pipe = { path = "../kanna-pipe" }
kanna-threads = { path = "../kanna-threads" }
libc = "0.2"
qrcode = { version = "0.14", default-features = false }
regex = "1"
serde_json = "1"

[dev-dependencies]
kanna-mux = { path = "../kanna-mux" }
kanna-net = { path = "../kanna-net" }
kanna-guest = { path = "../kanna-guest" }
tokio = { version = "1", features = ["rt-multi-thread"] }
libc = "0.2"
